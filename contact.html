<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact · GeoExcel</title>
<meta name="description" content="Get in touch with GeoExcel, Bangalore.">
<meta name="theme-color" content="#f5f1e8">
<link rel="icon" href="assets/logo.png">
<script>try{var t=localStorage.getItem('gx-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
<div id="gx-nav"></div>

<main id="main">
  <header class="page-head wrap"><span class="eyebrow">Contact</span><h1>Let’s talk trade.</h1></header>
  <div class="wrap two contact">
    <div class="panel-box contact-list">
      <div><svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 0 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><p><small>Address</small>3C918, 3rd Cross, 1st Block,<br>HRBR Layout, Bangalore 560043</p></div>
      <div><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><p><small>Phone</small><a href="tel:+918035110602">+91 8035110602</a></p></div>
      <div><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><p><small>Email</small><a href="mailto:Info@geoexcel.group">Info@geoexcel.group</a></p></div>
    </div>
    <form class="panel-box" id="contact-form"><h2>Send a message</h2><div class="fields f">
      <div><label for="first">First name</label><input id="first" name="first" autocomplete="given-name" required></div>
      <div><label for="last">Last name</label><input id="last" name="last" autocomplete="family-name" required></div>
      <div class="full"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="full"><label for="msg">Message</label><textarea id="msg" name="msg" required></textarea></div></div>
      <button class="btn btn-primary" type="submit" style="margin-top:18px">Send</button>
      <p id="sent" hidden style="margin-top:14px;color:var(--green);font-weight:600">Thanks for submitting! Your email app will open to send it.</p></form>
  </div>
</main>
<div id="gx-foot"></div>
<script src="js/data.js"></script>
<script src="js/pack.js"></script>
<script src="js/app.js"></script>
</body>
</html>
